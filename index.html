<!doctype html>
<html lang="en" dir="ltr">
<head>

  <style>
  :root { color-scheme: light dark; --bg:#FAFAF9; --surface:#FFFFFF; --border:#E3E2DF; --ink:#0C0B0A; --muted:#57544F; --accent:#4866CA; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0A0A09; --surface:#1A1A18; --border:#33322F; --ink:#F7F6F4; --muted:#ADAAA5; --accent:#8399E2; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:2.5rem 1.25rem 5rem; background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:44rem; margin:0 auto; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:2.5rem; }
  h1 { font-size:2rem; line-height:1.2; margin:0 0 .25rem; letter-spacing:-.02em; }
  .meta { color:var(--muted); margin:0 0 2rem; }
  h2 { font-size:1.2rem; margin:2rem 0 .5rem; }
  p { margin:0 0 1rem; }
  a { color:var(--accent); }
  footer { max-width:44rem; margin:2rem auto 0; color:var(--muted); font-size:.9rem; text-align:center; }
</style>
</head>
<body>
  <main>
    <h1>Legal</h1>

      <p><a href="privacy.html" hreflang="en">Privacy Policy</a></p>
